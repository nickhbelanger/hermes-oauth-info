name: Build Fat Herbie Archive
on:
  workflow_dispatch:
  push:
    paths:
      - 'ashland-fat-herbie-gallery/**'
      - '.github/workflows/fat-herbie-archive.yml'
  schedule:
    - cron: '23 10 * * 0'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scraper dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Collect public storefront product listings 1-227
        run: python ashland-fat-herbie-gallery/scrape.py
      - name: Commit archive data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ashland-fat-herbie-gallery/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Fat Herbie one-off gallery data"
            git push
          fi
